apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-cv
  namespace: webapps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog-cv
  template:
    metadata:
      labels:
        app: blog-cv
    spec:
      containers:
        - name: blog-cv
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: blog-cv-service
  namespace: webapps
spec:
  type: LoadBalancer
  selector:
    app: blog-cv
  ports:
    - port: 80
      targetPort: 3000
